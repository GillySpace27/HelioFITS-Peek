# CI: every push to main and every pull request.
#
#   check          scripts/check.sh: fast static invariants. Every other job needs it.
#   test           hosted unit tests, arm64. Tests run inside the GUI app; GitHub's
#                  macOS runners have a window server, so the host app can launch.
#   test-x86_64    the same tests on the Intel slice under Rosetta (the vendored
#                  libcfitsio.a in HelioFITSCore/CFITSIO.xcframework is universal).
#   release-build  Release configuration build, arm64, ad hoc signing.
#   core           HelioFITSCore package: swift test, the headless core tests (no app
#                  launch, nothing registered with LaunchServices).
#   ios            HelioFITS-iOS for the Simulator, unsigned. Both projects have a
#                  scheme named HelioFITS, so -project is always passed.
#   tooling        bash -n and py_compile over every tracked script, the tracker and
#                  watch self-tests, and the Spotlight importer on its ad hoc path.
#   fixtures       ubuntu: scripts/make_fixtures.py --selftest, then regenerates the synthetic
#                  fixtures and diffs them against HelioFITSTests/Fixtures (HF-5).
#   docs           ubuntu: builds the user manual (manual/) with Sphinx, warnings as errors (DOCS-3).
#   lint           swift format lint with .swift-format. Advisory: never blocks.
#
# Tests that need files only present on Gilly's Mac report as skipped, not passed.
# CI never signs with a real identity, uploads, releases or posts.
name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # check.sh diffs against origin/main
      - name: Toolchain
        run: xcodebuild -version
      - name: Static invariants
        run: bash scripts/check.sh

  test:
    needs: check
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: xcodebuild -version
      - name: Run unit tests (ad-hoc signing)
        run: |
          xcodebuild test -project HelioFITS.xcodeproj -scheme HelioFITS \
            -destination 'platform=macOS,arch=arm64' \
            -resultBundlePath TestResults.xcresult \
            DEVELOPMENT_TEAM=UB45PPC2JS CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual AD_HOC_CODE_SIGNING_ALLOWED=YES
      - name: Upload result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults.xcresult
          path: TestResults.xcresult

  test-x86_64:
    needs: check
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: xcodebuild -version
      - name: Rosetta (installed only when missing)
        run: |
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "Rosetta present"
          else
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
      - name: Run unit tests on x86_64 (ad-hoc signing)
        run: |
          xcodebuild test -project HelioFITS.xcodeproj -scheme HelioFITS \
            -destination 'platform=macOS,arch=x86_64' \
            -resultBundlePath TestResults-x86_64.xcresult \
            DEVELOPMENT_TEAM=UB45PPC2JS CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual AD_HOC_CODE_SIGNING_ALLOWED=YES
      - name: Test summary (skipped tests are counted, not hidden)
        if: always()
        run: xcrun xcresulttool get test-results summary --path TestResults-x86_64.xcresult || true
      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults-x86_64.xcresult
          path: TestResults-x86_64.xcresult

  release-build:
    # Mirrors what an archive compiles (Release config, arm64) so a
    # release-only build break can't hide until ship day.
    needs: check
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: xcodebuild -version
      - name: Release build (ad-hoc signing)
        run: |
          xcodebuild -project HelioFITS.xcodeproj -scheme HelioFITS \
            -configuration Release -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual \
            AD_HOC_CODE_SIGNING_ALLOWED=YES DEVELOPMENT_TEAM="" \
            build

  core:
    needs: check
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Test the core package (headless, no app launch)
        run: swift test --package-path HelioFITSCore
      - name: Build the root package (Heliad depends on it by URL)
        run: swift build --product HelioFITSCore

  ios:
    needs: check
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: xcodebuild -version
      - name: iOS Simulator build (unsigned)
        run: |
          xcodebuild -project HelioFITS-iOS/HelioFITS-iOS.xcodeproj -scheme HelioFITS \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

  tooling:
    needs: check
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: xcodebuild -version && python3 --version
      - name: Shell syntax (bash -n on every tracked .sh)
        run: git ls-files -z '*.sh' | xargs -0 -n1 bash -n
      - name: Python syntax (py_compile on every tracked .py)
        run: git ls-files -z '*.py' | xargs -0 python3 -m py_compile
      - name: Self-tests
        run: |
          python3 .claude/skills/ship-heliofits/scripts/release_status.py --selftest
          python3 .claude/skills/ship-heliofits/scripts/test_release_feed.py
          python3 .claude/skills/ship-heliofits/scripts/test_release_status.py
          python3 .claude/skills/ship-heliofits/scripts/test_store_sync.py
          python3 scripts/watch.py --selftest
      - name: Spotlight importer (ad hoc signing path)
        run: |
          bash FITSMetadataImporter/build.sh
          codesign --verify --verbose FITSMetadataImporter/build/FITSMetadataImporter.mdimporter
          lipo -archs FITSMetadataImporter/build/FITSMetadataImporter.mdimporter/Contents/MacOS/FITSMetadataImporter

  lint:
    needs: check
    runs-on: macos-15
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: swift format lint (advisory)
        run: git ls-files -z '*.swift' | xargs -0 swift format lint --configuration .swift-format

  colormaps:
    # FITSColormaps.swift is generated; this regenerates it from the pinned
    # sunpy and the six CSVs in tools/colormaps/extra/ and fails on any byte of
    # difference. Fix the generator, never the Swift file (HF-6).
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Pinned generator inputs
        run: python3 -m pip install -r tools/colormaps/requirements.txt
      - name: Regenerate and diff (no output means identical)
        run: python3 tools/colormaps/gen_colormaps.py | diff -u HelioFITSCore/Sources/HelioFITSCore/FITSColormaps.swift -
      - name: --json-out tests (SU-12)
        run: python3 tools/colormaps/test_json_out.py

  fixtures:
    # HelioFITSTests/Fixtures holds the synthetic files; the real AIA and PUNCH cutouts
    # live in its Real/ folder (register question 21, answered 2026-10-12) and are cut
    # from files on Gilly's Mac, so CI cannot regenerate them and the diff skips Real/.
    # The synthetic files are generated, so a hand edit or a script change that moves a
    # byte shows up here as a diff. Regenerate with
    # python3 scripts/make_fixtures.py --synthetic after moving the old files aside.
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Pinned inputs
        run: python3 -m pip install -r scripts/requirements-fixtures.txt
      - name: make_fixtures.py self-test
        run: python3 scripts/make_fixtures.py --selftest
      - name: Regenerate the synthetic fixtures and diff (no output means identical)
        run: |
          python3 scripts/make_fixtures.py --synthetic --tests-out "$RUNNER_TEMP/fixtures"
          diff -r -x Real "$RUNNER_TEMP/fixtures" HelioFITSTests/Fixtures

  docs:
    # The user manual (manual/, DOCS-3): Sphinx with warnings as errors, on the Python that Read the
    # Docs uses (.readthedocs.yaml), so a broken page or link fails here before it fails there.
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Pinned inputs
        run: python3 -m pip install -r manual/requirements.txt
      - name: Build the manual (HTML, warnings as errors)
        run: python3 -m sphinx -q -W --keep-going -b html manual "$RUNNER_TEMP/manual-html"
