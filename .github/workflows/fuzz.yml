# Fuzz the two C parsers that read untrusted FITS bytes (HF-11): the CFITSIO
# shim linked into every HelioFITS Peek target and the Spotlight importer's header
# reader. Weekly for 10 minutes per harness, 2 minutes on a PR that touches
# them, and on demand. A crash fails the job and its input is uploaded as an
# artifact; commit that input under Fuzz/regressions/<harness>/ with the fix.
name: fuzz

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: "Fuzzing time per harness (libFuzzer -max_total_time)"
        default: "600"
      canary:
        description: "Build with FUZZ_CANARY=1 (deliberate out-of-bounds read; verification only)"
        type: boolean
        default: false
  pull_request:
    paths:
      - "Fuzz/**"
      - ".github/workflows/fuzz.yml"
      - "HelioFITSExtension/cfitsio/fitsshim.c"
      - "HelioFITSExtension/cfitsio/fitsshim.h"
      - "HelioFITSExtension/cfitsio/build-universal.sh"
      - "FITSMetadataImporter/fits_header.c"
      - "FITSMetadataImporter/fits_header.h"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        harness: [fitsshim_fuzz, fits_header_fuzz]
    env:
      CC: clang-18
      FUZZ_CANARY: ${{ inputs.canary && '1' || '' }}
      SECONDS_PER_HARNESS: ${{ inputs.seconds || (github.event_name == 'pull_request' && '120') || '600' }}
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (clang 18 with the libFuzzer runtime, zlib)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 libclang-rt-18-dev zlib1g-dev
      - name: Build CFITSIO and the harnesses
        run: bash Fuzz/build.sh ${{ matrix.harness }}
      - name: Replay regression inputs
        run: |
          shopt -s nullglob
          inputs=(Fuzz/regressions/${{ matrix.harness }}/*)
          if [ ${#inputs[@]} -eq 0 ]; then echo "no regression inputs for ${{ matrix.harness }}"; exit 0; fi
          Fuzz/out/${{ matrix.harness }} "${inputs[@]}"
      - name: Input limit test (cap, overflow, gzip/PKZIP, unlimited path)
        if: matrix.harness == 'fitsshim_fuzz'
        run: Fuzz/out/shim_cap_test
      - name: Fuzz for ${{ env.SECONDS_PER_HARNESS }} s
        working-directory: Fuzz/out
        run: |
          # libFuzzer's default malloc limit (2048 MB) is kept on purpose. The fitsshim
          # harness runs the shim as the extensions do, with the 2^28 pixel limit set
          # (fitsshim_set_max_pixels), so an oversized header and gzip or PKZIP input
          # are refused by the shim and need no skip; any other large allocation is
          # reported. See "Known findings" in SECURITY.md.
          # ASAN_OPTIONS=allocator_may_return_null=1: a header-driven calloc whose
          # count * size overflows (CFITSIO ffbinit, TFIELDS read from the header) aborts
          # under ASan by default, but in the shipped app calloc returns NULL and ffbinit
          # returns ARRAY_TOO_BIG. The fuzzer now sees what the app sees. The malloc limit
          # above still reports allocations that succeed but are huge.
          export ASAN_OPTIONS=allocator_may_return_null=1
          ./${{ matrix.harness }} -max_total_time="$SECONDS_PER_HARNESS" -print_final_stats=1 \
            corpus/${{ matrix.harness }}
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.harness }}-crashes
          path: |
            Fuzz/out/crash-*
            Fuzz/out/leak-*
            Fuzz/out/oom-*
            Fuzz/out/timeout-*
          if-no-files-found: ignore
